name: ♻ CI
on: 
  workflow_call:
  pull_request:
    branches: 
      - main 

permissions:
  contents: read

jobs:
  setup:
    name: 🏗 Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: 'pip'
      - run: pip install -r requirements.txt

  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - run: pylint src
